<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>我的 AI 工具箱</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/app.js"></script>
  </head>
  <body>
    <header class="mast">
      <div class="brand">
        <span class="brandmark" aria-hidden="true">✳</span>我的 AI 工具箱
      </div>
      <span class="device"><i></i><span id="mode">本机工作区</span></span>
    </header>
    <div class="layout">
      <aside>
        <nav id="nav" aria-label="工作区导航"></nav>
        <div class="sync">
          <span id="stamp" role="status">正在读取本机目录…</span
          ><button id="reload">↻ 刷新目录</button>
        </div>
      </aside>
      <main>
        <div class="intro">
          <div>
            <h1 id="heading">工作方法</h1>
            <p id="hint">按要做的事，找到可以调用的 Skill。</p>
          </div>
        </div>
        <section class="tools" aria-label="搜索与筛选">
          <label class="search"
            ><span aria-hidden="true">⌕</span
            ><input
              id="search"
              type="search"
              aria-label="搜索资产"
              placeholder="你想做什么？试试「调试模拟器」"
              autocomplete="off"
          /></label>
          <div class="filters">
            <select id="app" aria-label="按来源筛选">
              <option value="">全部来源</option>
              <option>Codex</option>
              <option>Claude</option>
              <option value="shared">两端共用</option></select
            ><select id="group" aria-label="按类型筛选"></select
            ><select id="sort" aria-label="排序">
              <option value="recent">最近更新</option>
              <option value="name">名称排序</option></select
            ><button id="reset" hidden>清除筛选</button>
          </div>
        </section>
        <p id="alert" role="alert" hidden></p>
        <section id="map" aria-label="记忆主题地图" hidden></section>
        <section id="listing">
          <div class="sectiontitle">
            <h2 id="listtitle">全部工作方法</h2>
            <span id="count"></span>
          </div>
          <div id="cards"></div>
          <div class="foot">
            <span id="range"></span>
            <div>
              <button id="prev">上一页</button><button id="next">下一页</button>
            </div>
          </div>
        </section>
      </main>
    </div>
    <dialog id="detail" aria-labelledby="title">
      <div class="dialoghead">
        <h2 id="title"></h2>
        <button id="close">关闭</button>
      </div>
      <div id="body"></div>
    </dialog>
  </body>
</html>
